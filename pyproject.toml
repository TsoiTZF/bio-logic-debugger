[project]
name = "bio-logic-debugger"
version = "0.2.3"
description = "让邺城燃烧 - 育种目标生物逻辑验证工具"
authors = [
    {name = "TsoiTZF"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.28.0",
    "httpx>=0.24.0",
    "PyMuPDF>=1.23.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
]

[project.scripts]
bld = "bio_logic_debugger.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bio_logic_debugger*"]

[tool.setuptools.package-data]
bio_logic_debugger = ["knowledge/data/*.json", "knowledge/builtin/*.json"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
